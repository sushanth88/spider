services:
  postgres:
    image: postgres:15-alpine
    container_name: spider-postgres
    environment:
      POSTGRES_DB: spider_dev
      POSTGRES_USER: spider
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spider -d spider_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: raghav0401/spider-flask:latest
    container_name: spider-web
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://spider:${POSTGRES_PASSWORD}@postgres:5432/spider_dev
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: "False"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  breakthru-scraper:
    image: raghav0401/spider-scraper:latest
    container_name: breakthru-scraper
    environment:
      WEBSITE_USERNAME: ${WEBSITE_USERNAME}
      WEBSITE_PASSWORD: ${WEBSITE_PASSWORD}
      DATABASE_URL: postgresql://spider:${POSTGRES_PASSWORD}@postgres:5432/spider_dev
    command: ["python", "run_scraper.py"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - scrapers

  nks-scraper:
    image: raghav0401/spider-scraper:latest
    container_name: spider-nks-scraper
    environment:
      VTINFO_USERNAME: ${VTINFO_USERNAME}
      VTINFO_PASSWORD: ${VTINFO_PASSWORD}
      VTINFO_RETAILER_ID: ${VTINFO_RETAILER_ID:-15786}
      DATABASE_URL: postgresql://spider:${POSTGRES_PASSWORD}@postgres:5432/spider_dev
    entrypoint: ["python", "run_vtinfo_scraper.py"]
    command: ["--vendor", "nks"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - scrapers

  standard-scraper:
    image: raghav0401/spider-scraper:latest
    container_name: spider-standard-scraper
    environment:
      VTINFO_USERNAME: ${VTINFO_USERNAME}
      VTINFO_PASSWORD: ${VTINFO_PASSWORD}
      VTINFO_RETAILER_ID: ${VTINFO_RETAILER_ID:-15786}
      DATABASE_URL: postgresql://spider:${POSTGRES_PASSWORD}@postgres:5432/spider_dev
    entrypoint: ["python", "run_vtinfo_scraper.py"]
    command: ["--vendor", "standard"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - scrapers

  sgproof-scraper:
    image: raghav0401/spider-sgproof-scraper:latest
    container_name: sgproof-scraper
    environment:
      WEBSITE_USERNAME: ${SGPROOF_USERNAME}
      WEBSITE_PASSWORD: ${SGPROOF_PASSWORD}
      DATABASE_URL: postgresql://spider:${POSTGRES_PASSWORD}@postgres:5432/spider_dev
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - scrapers

volumes:
  postgres-data:
    external: true
    name: spider_spider-postgres-data
