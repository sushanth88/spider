version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    command: python app.py
    restart: unless-stopped

  scraper:
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
    command: python run_scraper.py
    profiles:
      - scraper

  nks-scraper:
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - ./VT_info.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
    entrypoint: ["python", "run_vtinfo_scraper.py"]
    command: ["--vendor", "nks"]
    profiles:
      - scraper

  standard-scraper:
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - ./VT_info.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
    entrypoint: ["python", "run_vtinfo_scraper.py"]
    command: ["--vendor", "standard"]
    profiles:
      - scraper

  sgproof-scraper:
    build:
      context: .
      dockerfile: docker/sgproof/Dockerfile
    image: spider-sgproof-scraper:local
    env_file:
      - path: .env
        required: false
    environment:
      - WEBSITE_USERNAME=${SGPROOF_USERNAME}
      - WEBSITE_PASSWORD=${SGPROOF_PASSWORD}
      - DATABASE_URL=${DATABASE_URL:-}
    restart: "no"
    profiles:
      - scraper
